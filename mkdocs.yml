site_name: PepIntProt Documentation
site_description: "Peptide–Protein & Protein–Ligand Interaction Profiler from Molecular Dynamics Simulations"
site_author: PepIntProt Team
site_url: https://pepintprot.readthedocs.io/

repo_name: vbonatto11/PepIntProt
repo_url: https://github.com/vbonatto11/PepIntProt

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
  logo: assets/logov1.png
  favicon: assets/logov1.png

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started.md
    - Quick Start: quick-start.md
  - User Guide:
    - System Modes: usage.md
    - Analyses: analyses.md
    - Protein–Ligand Mode: protein-ligand.md
    - Multi-Replica: multi-replica.md
    - AI Reports: ai-reports.md
  - Platforms:
    - Google Colab: colab.md
    - Databricks Apps: databricks.md
  - Reference:
    - Parameters: parameters.md
    - FAQ: faq.md
    - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vbonatto11/PepIntProt
